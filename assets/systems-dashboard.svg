    <text x="463" y="110" fill="#FF4655" font-family="monospace" font-size="10" font-weight="700" letter-spacing="2">OPERATING MODE</text>
    <text x="463" y="145" fill="#F5EFE2" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">BUILD &amp; ITERATE</text>
