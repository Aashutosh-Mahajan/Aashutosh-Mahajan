    <text x="80" y="110" fill="#FF4655" font-family="monospace" font-size="10" font-weight="700" letter-spacing="2">CURRENT VECTOR</text>
    <text x="80" y="145" fill="#F5EFE2" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">AI + BACKEND</text>
