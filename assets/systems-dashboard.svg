<svg width="1200" height="270" viewBox="0 0 1200 270" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description">
  <title id="title">Engineering systems dashboard</title>
  <desc id="description">A clean dark technical dashboard showing Aashutosh's engineering profile.</desc>
  <defs>
    <linearGradient id="dashBg" x1="0" y1="0" x2="1200" y2="270" gradientUnits="userSpaceOnUse"><stop stop-color="#0A0A0A"/><stop offset="0.5" stop-color="#15110F"/><stop offset="1" stop-color="#0A0A0A"/></linearGradient>
    <filter id="dashGlow" x="-30%" y="-100%" width="160%" height="300%"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="270" rx="14" fill="url(#dashBg)"/>
  <path d="M45 55H1155M45 218H1155" stroke="#F5EFE2" stroke-opacity="0.1"/>
